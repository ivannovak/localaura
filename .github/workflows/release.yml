name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        echo "## What's Changed" > CHANGELOG.md
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s (%an)" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^)...${{ steps.get_version.outputs.VERSION }}" >> CHANGELOG.md

    - name: Build binaries
      run: |
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o aura-linux-amd64 ./cmd/aura

        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o aura-linux-arm64 ./cmd/aura

        # macOS AMD64 (Intel)
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o aura-darwin-amd64 ./cmd/aura

        # macOS ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o aura-darwin-arm64 ./cmd/aura

        # Make all binaries executable
        chmod +x aura-*

    - name: Create checksums
      run: |
        sha256sum aura-linux-amd64 > checksums.txt
        sha256sum aura-linux-arm64 >> checksums.txt
        sha256sum aura-darwin-amd64 >> checksums.txt
        sha256sum aura-darwin-arm64 >> checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        files: |
          aura-linux-amd64
          aura-linux-arm64
          aura-darwin-amd64
          aura-darwin-arm64
          checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update installation instructions
      run: |
        echo "✅ Release ${{ steps.get_version.outputs.VERSION }} published"
        echo ""
        echo "Installation instructions:"
        echo ""
        echo "Linux AMD64:"
        echo "  curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/aura-linux-amd64 -o aura"
        echo ""
        echo "macOS ARM64 (Apple Silicon):"
        echo "  curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/aura-darwin-arm64 -o aura"
        echo ""
        echo "Then:"
        echo "  chmod +x aura && sudo mv aura /usr/local/bin/"
